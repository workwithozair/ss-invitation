<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9F0F6">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="You are warmly invited to celebrate our wedding">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Wedding Invitation">
  <meta property="og:description" content="You are warmly invited to celebrate our wedding">
  <meta property="og:image" content="https://shaan-weds-shaquib.publicvm.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://YOUR-SITE-URL/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://shaan-weds-shaquib.publicvm.com/og-image.jpg">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="pt" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8AA6C4"/><stop offset="1" stop-color="#F4F8FB"/></linearGradient>
<linearGradient id="pt2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4A6A92"/><stop offset="1" stop-color="#B9CDE2"/></linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7F9BBA"/><stop offset="1" stop-color="#C9D9E8"/></linearGradient>
<radialGradient id="ct"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8AA6C4"/></radialGradient>
<g id="lf"><path d="M0 0 C 14 -12, 34 -12, 46 0 C 34 12, 14 12, 0 0Z" fill="url(#lg)"/><path d="M2 0 L40 0" stroke="#2E4B7A" stroke-width=".8" opacity=".6"/></g>
<g id="fl"><g fill="url(#pt)" stroke="#4A6A92" stroke-width=".5" stroke-opacity=".45"><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(0)"/><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(45)"/><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(90)"/><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(135)"/><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(180)"/><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(225)"/><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(270)"/><ellipse cx="0" cy="-22" rx="13" ry="22" transform="rotate(315)"/></g><g fill="url(#pt2)" stroke="#2E4B7A" stroke-width=".4" stroke-opacity=".4"><ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(0)"/><ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(60)"/><ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(120)"/><ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(180)"/><ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(240)"/><ellipse cx="0" cy="-15" rx="10" ry="16" transform="rotate(300)"/></g><g fill="url(#pt)" stroke="#2E4B7A" stroke-width=".4" stroke-opacity=".5"><ellipse cx="0" cy="-8" rx="6" ry="9.5" transform="rotate(0)"/><ellipse cx="0" cy="-8" rx="6" ry="9.5" transform="rotate(72)"/><ellipse cx="0" cy="-8" rx="6" ry="9.5" transform="rotate(144)"/><ellipse cx="0" cy="-8" rx="6" ry="9.5" transform="rotate(216)"/><ellipse cx="0" cy="-8" rx="6" ry="9.5" transform="rotate(288)"/></g><circle r="4" fill="url(#ct)"/><g fill="#2E4B7A"><circle cx="4.5" cy="0.0" r="1.1"/><circle cx="2.8" cy="3.5" r="1.1"/><circle cx="-1.0" cy="4.4" r="1.1"/><circle cx="-4.1" cy="2.0" r="1.1"/><circle cx="-4.1" cy="-2.0" r="1.1"/><circle cx="-1.0" cy="-4.4" r="1.1"/><circle cx="2.8" cy="-3.5" r="1.1"/></g></g>
<g id="sf"><g fill="#F4F8FB" stroke="#8AA6C4" stroke-width=".7"><circle cx="0" cy="-7" r="6.2" transform="rotate(0)"/><circle cx="0" cy="-7" r="6.2" transform="rotate(72)"/><circle cx="0" cy="-7" r="6.2" transform="rotate(144)"/><circle cx="0" cy="-7" r="6.2" transform="rotate(216)"/><circle cx="0" cy="-7" r="6.2" transform="rotate(288)"/></g><circle r="3.2" fill="url(#ct)"/></g>
<g id="branch"><path d="M18 0 C 70 70, 8 140, 62 215 S 36 340, 84 420" fill="none" stroke="#7F9BBA" stroke-width="2.2" stroke-linecap="round"/><use href="#lf" transform="translate(36 40) rotate(25) scale(0.9)"/><use href="#lf" transform="translate(30 95) rotate(165) scale(0.8)"/><use href="#lf" transform="translate(56 165) rotate(10) scale(1)"/><use href="#lf" transform="translate(44 205) rotate(155) scale(0.9)"/><use href="#lf" transform="translate(48 262) rotate(20) scale(1)"/><use href="#lf" transform="translate(58 318) rotate(160) scale(0.8)"/><use href="#lf" transform="translate(70 375) rotate(15) scale(0.9)"/><use href="#sf" transform="translate(30 20) rotate(0) scale(0.9)"/><use href="#sf" transform="translate(98 62) rotate(0) scale(0.8)"/><use href="#sf" transform="translate(24 182) rotate(0) scale(0.8)"/><use href="#sf" transform="translate(104 300) rotate(0) scale(0.8)"/><use href="#sf" transform="translate(70 190) rotate(0) scale(0.6)"/><use href="#sf" transform="translate(90 285) rotate(0) scale(0.7)"/><use href="#fl" transform="translate(66 130) rotate(10) scale(0.85)"/><use href="#fl" transform="translate(58 240) rotate(-15) scale(1.05)"/><use href="#fl" transform="translate(92 385) rotate(30) scale(0.7)"/><use href="#fl" transform="translate(30 320) rotate(0) scale(0.5)"/></g>
</defs></svg>

  <!-- Door intro -->
  <div id="doors" aria-label="Open invitation">
    <div class="door left"><svg class="door-side l" viewBox="0 0 140 420" aria-hidden="true"><use href="#branch"/></svg></div>
    <div class="door right"><svg class="door-side r" viewBox="0 0 140 420" aria-hidden="true"><use href="#branch"/></svg></div>
    <button id="openBtn" class="open-btn">
      <span class="monogram" id="monogram" hidden></span>
      <span hidden>Tap to open</span>
      <img src="btn.jpeg" alt="Tap to open" draggable="false">
    </button>
  </div>

  <button id="musicBtn" class="music" aria-label="Toggle music" hidden>♪</button>

  <main id="app" hidden>
    <section class="hero" id="hero">
      <div class="petals" id="petals" aria-hidden="true"></div>
      <svg class="side hs l" viewBox="0 0 140 420" aria-hidden="true"><use href="#branch"/></svg><svg class="side hs r" viewBox="0 0 140 420" aria-hidden="true"><use href="#branch"/></svg><svg class="side hs bl" viewBox="0 0 140 420" aria-hidden="true"><use href="#branch"/></svg><svg class="side hs br" viewBox="0 0 140 420" aria-hidden="true"><use href="#branch"/></svg>
      <img class="hero-logo" src="logo.jpg" alt="Couple monogram logo">
      <p class="small1" id="eventType1"></p>
      <p class="small2" id="eventType2"></p>
      <h1 class="names"><span id="p1"></span><i>&amp;</i><span id="p2"></span></h1>
      <div class="scroll-cue" aria-hidden="true"></div>
      <p class="scroll" aria-hidden="true">Scroll</p>
    </section>

    <section class="block intro" id="introSec">
      <div class="divider"><i>&#9829;</i></div>
      <p class="intro-text" id="intro"></p>
      <div class="divider"><i>&#9829;</i></div>
    </section>

    <section class="block" id="scratchSec">
      <h2>Scratch to Reveal</h2>
      <div class="scratch-wrap">
        <div class="date-under"><strong id="dateText"></strong><span id="timeText"></span></div>
        <canvas id="scratch"></canvas>
      </div>
      <button class="btn save" id="saveBtn" type="button"></button>
    </section>

    <section class="block alt" id="slideSec">
      <h2 id="slideTitle"></h2>
      <div class="slides" id="slides"></div>
    </section>

    <section class="block" id="countSec">
      <h2 id="countTitle"></h2>
      <div class="count" id="count"></div>
    </section>

    <section class="block alt" id="progSec">
      <h2 id="progTitle"></h2>
      <div class="program" id="program"></div>
    </section>

    <section class="block" id="venueSec">
      <h2 id="venueTitle"></h2>
      <h3 id="venueName"></h3>
      <p class="venue-addr" id="venueAddr"></p>
      <div class="map"><iframe id="mapFrame" loading="lazy" title="Venue map" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <a class="btn" id="mapLink" target="_blank" rel="noopener"></a>
    </section>

    <section class="block alt" id="preSec">
      <h2 id="preTitle"></h2>
      <div class="program" id="timeline"></div>
    </section>

    <section class="block" id="transSec">
      <h2 id="transTitle"></h2>
      <p class="plain" id="transText"></p>
    </section>

    <section class="block alt" id="giftSec">
      <h2 id="giftTitle"></h2>
      <p class="plain" id="giftText"></p>
    </section>

    <section class="block" id="rsvpSec">
      <h2 id="rsvpTitle"></h2>
      <form id="rsvpForm" autocomplete="off">
        <label>Your Name <span class="req">*</span>
          <input name="name" placeholder="Your full name" required>
        </label>
        <label>Will you be attending? <span class="req">*</span>
          <select name="attending" required>
            <option value="Joyfully attending">Joyfully attending</option>
            <option value="Sorry, can't make it">Sorry, can't make it</option>
          </select>
        </label>
        <label>Number of guests
          <input name="guests" type="number" min="1" max="10" value="1">
        </label>
        <label>Your Message
          <textarea name="message" rows="3" placeholder="Write your wishes..."></textarea>
        </label>
        <button class="btn" type="submit" id="sendBtn"></button>
      </form>
      <p class="thanks" id="thanks" hidden></p>
    </section>

    <section class="closing">
      <h2 id="closing"></h2>
      <p class="closing-names" id="closingNames"></p>
    </section>

    <footer><p id="footer"></p></footer>
  </main>

  <audio id="bgm" loop></audio>
  <script src="script.js"></script>
</body>
</html>
